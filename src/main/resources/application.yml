logging:
  level:
    root: info  # 根日志级别，控制所有未明确指定的日志
    com.zd: info
    com.company: info
    org.springframework: warn
    httpDataLog: debug  # HTTP数据日志级别

spring:
  datasource:
    # 根据情况决定是否启用 ?journal_mode=WAL
    url: jdbc:sqlite:./zd.db?synchronous=NORMAL&busy_timeout=30000&cache_size=10000&temp_store=MEMORY
    type: com.alibaba.druid.pool.DruidDataSource
    # druid相关配置
    druid:
    # 连接池初始化大小
      initial-size: 2
      # 最大活跃连接数
      max-active: 5
      # 最小空闲连接数
      min-idle: 1
      # 获取连接等待超时的时间
      max-wait: 60000
      # 间隔多久才进行一次检测，检测需要关闭的空闲连接，ms
      time-between-eviction-runs-millis: 60000

      validation-query: select 'x'
      # 配置过滤器，https://github.com/alibaba/druid/wiki/%E5%86%85%E7%BD%AEFilter%E7%9A%84%E5%88%AB%E5%90%8D
      filters: stat,slf4j,config
      statViewServlet:
        enabled: true
        # 设置白名单，不填则允许所有访问
        allow:
        url-pattern: /druid/*
        # 控制台管理用户名和密码
        login-username: zd
        login-password: 123456
  profiles:
    active: @profiles.active@
  sql:
    init:
      mode: never # 危险的开关

mybatis-plus:
  global-config:
    db-config:
      id-type: auto

# 倾角传感器 API 配置
incline:
  api:
    base-url: https://www.zhtk-iot.com:8543/api
    username: dxkj
    password: dxkj250808
    connect-timeout: 30
    read-timeout: 30
    write-timeout: 30
    token-refresh-interval: 80  # Token刷新间隔（分钟），默认2小时

# 振动孤立尖峰过滤：疑似尖峰暂存，下一条恢复到前一条附近才丢弃中间点。
# 连续高值、报警/故障/状态未知、缺少前后邻点时保留；过滤原值写入告警日志。
vibration:
  filter:
    enabled: true
    spike-min-delta: 2.0  # 中间点绝对幅值比前后两点分别至少增大多少，单位 m/s²
    return-tolerance: 0.5  # 前后两点允许的加速度差，单位 m/s²
    max-gap-seconds: 5400  # 90分钟，适配当前约每小时一条记录；超时不能确认则保留
    device-codes:
      - ZYXH-VIB-P01-002-02

server:
  port: 42009

radar:
  water:
    enable: false
