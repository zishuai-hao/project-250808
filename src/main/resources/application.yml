logging:
  level:
    root: info  # 根日志级别，控制所有未明确指定的日志
    com.zd: info
    com.company: info
    org.springframework: warn
    httpDataLog: debug  # HTTP数据日志级别

spring:
  datasource:
    # 根据情况决定是否启用 ?journal_mode=WAL
    url: jdbc:sqlite:./zd.db?synchronous=NORMAL&busy_timeout=30000&cache_size=10000&temp_store=MEMORY
    type: com.alibaba.druid.pool.DruidDataSource
    # druid相关配置
    druid:
    # 连接池初始化大小
      initial-size: 2
      # 最大活跃连接数
      max-active: 5
      # 最小空闲连接数
      min-idle: 1
      # 获取连接等待超时的时间
      max-wait: 60000
      # 间隔多久才进行一次检测，检测需要关闭的空闲连接，ms
      time-between-eviction-runs-millis: 60000

      validation-query: select 'x'
      # 配置过滤器，https://github.com/alibaba/druid/wiki/%E5%86%85%E7%BD%AEFilter%E7%9A%84%E5%88%AB%E5%90%8D
      filters: stat,slf4j,config
      statViewServlet:
        enabled: true
        # 设置白名单，不填则允许所有访问
        allow:
        url-pattern: /druid/*
        # 控制台管理用户名和密码
        login-username: zd
        login-password: 123456
  profiles:
    active: @profiles.active@
  sql:
    init:
      mode: never # 危险的开关

mybatis-plus:
  global-config:
    db-config:
      id-type: auto

# 倾角传感器 API 配置
incline:
  api:
    base-url: https://www.zhtk-iot.com:8543/api
    username: dxkj
    password: dxkj250808
    connect-timeout: 30
    read-timeout: 30
    write-timeout: 30
    token-refresh-interval: 80  # Token刷新间隔（分钟），默认2小时

# 振动单条孤立尖峰过滤，以下为当前数据的建议初始配置。
# 仅过滤“正常 -> 单条突增 -> 恢复”；连续两条及以上高值原值放行。
# 报警/故障/状态未知、缺少前后邻点或等待超时均保留；过滤原值写入告警日志。
# 加速度参数均按现有 mG -> m/s² 换算后的数值配置，倍数和窗口条数除外。
vibration:
  filter:
    enabled: true
    # 两个突增分支满足任一即可：绝对幅值增量 >= 2，或“绝对幅值达到历史基线10倍且比邻点至少增大0.05”。
    spike-min-delta: 2.0
    spike-ratio: 10.0  # 例如历史基线约 0.006，峰值 0.137 可进入待确认
    relative-min-delta: 0.05  # 防止很小的幅值因倍数大而误判
    noise-floor: 0.001  # 倍数计算的分母下限，防止历史基线为零或接近零
    baseline-window-size: 24  # 最近24条正常记录的绝对幅值中位数，当前约覆盖一天
    # 恢复容差仅限制突增前后两条的差值，不是振动幅值上限；过小会让孤立尖峰因未恢复而放行。
    return-tolerance: 0.05  # 按历史前后点差值设置的初始值；后一条还必须不再满足突增判据
    max-gap-seconds: 5400  # 90分钟，适配每小时一条；同时作为待确认超时
    # 仅对以下已核查测点启用；新增测点前先核对其正常幅值分布。
    device-codes:
      - ZYXH-VIB-P01-002-02
      - CBXH-VIB-P01-001-03

server:
  port: 42009

radar:
  water:
    enable: false
